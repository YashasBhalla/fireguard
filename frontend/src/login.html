<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FireGuard Fleet Portal</title><link rel="stylesheet" href="../css/tokens.css"></head><body><div data-shell="public"><main class="login-wrap"><form class="login-card" id="demo-login"><div class="eyebrow">FireGuard Fleet Portal</div><h2 style="margin-top:8px">Demo operator access</h2><p>Use the demo credentials below to open Mission Control.</p><div class="card" style="padding:14px;margin:18px 0"><div class="label">Demo credentials</div><p style="margin:6px 0 2px">Email: <b class="mono">demo123</b></p><p style="margin:0">Password: <b class="mono">demo</b></p></div><div class="field"><label>Demo ID</label><input id="email" type="text" autocomplete="username" required value="demo123"></div><div class="field"><label>Password</label><input id="password" type="password" required placeholder="Enter demo password"></div><p id="login-error" style="color:#ff8585;display:none" role="alert">Those demo credentials don’t match. Check the values above and try again.</p><button class="btn primary full" style="margin-top:12px">Enter Mission Control →</button><p style="font-size:11px;text-align:center">Demo-only sign-in for the project prototype.</p></form></main></div><script type="module" src="../js/app.js"></script><script>document.getElementById('demo-login').addEventListener('submit',e=>{e.preventDefault();const ok=document.getElementById('email').value==='demo123'&&document.getElementById('password').value==='demo';if(ok)location.href='dashboard.html';else document.getElementById('login-error').style.display='block'})</script></body></html>
